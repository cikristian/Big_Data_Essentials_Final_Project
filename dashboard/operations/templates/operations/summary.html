<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Database Summary</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #10233f;
    }
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 24px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: 32px;
    }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #087cf0;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }
    .label {
      color: #6b7b90;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .value {
      margin-top: 12px;
      font-size: 30px;
      font-weight: 700;
    }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      margin-bottom: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #edf1f6;
    }
    th {
      color: #4b5d75;
      background: #f7fafe;
    }
    .status-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .badge {
      background: #eaf5ff;
      color: #0a66d4;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <p style="margin:0;color:#087cf0;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;font-size:12px;">Operations summary</p>
        <h1>Database overview</h1>
      </div>
      <button class="btn" id="generate-btn">Generate random trips</button>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">Total trips</div>
        <div class="value" id="total-trips">—</div>
      </div>
      <div class="card">
        <div class="label">Delayed trips</div>
        <div class="value" id="delayed-trips">—</div>
      </div>
      <div class="card">
        <div class="label">Delay rate</div>
        <div class="value" id="delay-rate">—</div>
      </div>
      <div class="card">
        <div class="label">Top route</div>
        <div class="value" id="top-route">—</div>
      </div>
    </div>

    <div class="panel">
      <h2>Transport means</h2>
      <div class="status-row" id="transport-badges"></div>
      <table>
        <thead>
          <tr>
            <th>Transport means</th>
            <th>Trips</th>
          </tr>
        </thead>
        <tbody id="transport-table"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Database records</h2>
      <div id="records-status" style="margin-top:8px;color:#6b7b90;font-size:13px;">Showing the latest records from the full database.</div>
      <div id="recent-events" style="margin-top: 12px; color: #425777;">Loading…</div>
    </div>
  </div>

  <script>
    async function loadSummary() {
      const response = await fetch('/api/database-summary/?t=' + Date.now(), { cache: 'no-store' });
      const data = await response.json();
      const summary = data.summary || {};
      document.getElementById('total-trips').textContent = summary.total_trips ?? 0;
      document.getElementById('delayed-trips').textContent = summary.delayed_trips ?? 0;
      document.getElementById('delay-rate').textContent = (summary.delay_rate ?? 0) + '%';
      document.getElementById('top-route').textContent = summary.top_route || '-';

      const transport = summary.transport_means || {};
      const rows = Object.entries(transport);
      const badges = rows.map(([name, count]) => `<span class="badge">${name}: ${count}</span>`).join('');
      document.getElementById('transport-badges').innerHTML = badges || '<span class="badge">No transport data</span>';
      document.getElementById('transport-table').innerHTML = rows.length
        ? rows.map(([name, count]) => `<tr><td>${name}</td><td>${count}</td></tr>`).join('')
        : '<tr><td colspan="2">No transport data available.</td></tr>';

      const events = data.events || [];
      document.getElementById('records-status').textContent = `Showing the latest ${Math.min(events.length, 8)} records from ${summary.total_trips ?? 0} total database records.`;
      if (!events.length) {
        document.getElementById('recent-events').textContent = 'No trip data in the database yet.';
        return;
      }

      const rowsHtml = events.slice(0, 8).map(event => {
        return `<div style="padding:10px 0;border-bottom:1px solid #edf1f6;">${event.route_id || 'Unknown'} · ${event.transport_type || 'Unknown'} · delayed: ${event.delayed ?? 0}</div>`;
      }).join('');
      document.getElementById('recent-events').innerHTML = rowsHtml;
    }

    document.getElementById('generate-btn').addEventListener('click', async () => {
      const count = 25;
      const res = await fetch('/api/data/generate/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ count })
      });
      const json = await res.json();
      alert(json.message || 'Trips generated.');
      await loadSummary();
    });

    loadSummary();
    setInterval(loadSummary, 2000);
  </script>
</body>
</html>
